<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Rearrange: Rajshahi Board – 2023</title>
    <style>
        :root {
            --primary-color: #2563eb;
            --success-color: #16a34a;
            --error-color: #dc2626;
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-color: #1e293b;
            --border-color: #e2e8f0;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            padding: 12px;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 600px;
            background: var(--card-bg);
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.05);
            margin-top: 10px;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
            border-bottom: 2px solid var(--border-color);
            padding-bottom: 12px;
        }

        h1 {
            font-size: 1.15rem;
            font-weight: 700;
        }

        .timer-badge {
            background: #fee2e2;
            color: var(--error-color);
            padding: 6px 14px;
            border-radius: 20px;
            font-weight: 700;
            font-size: 0.95rem;
            font-variant-numeric: tabular-nums;
        }

        .instructions {
            font-size: 0.85rem;
            color: #64748b;
            margin-bottom: 16px;
            line-height: 1.4;
        }

        .sortable-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-bottom: 20px;
            list-style: none;
        }

        .sortable-item {
            display: flex;
            align-items: center;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 10px 12px;
            touch-action: none;
            user-select: none;
            position: relative;
        }

        .sortable-item.dragging {
            opacity: 0.4;
            background: #eff6ff;
            border-color: var(--primary-color);
        }

        .drag-handle {
            display: flex;
            align-items: center;
            justify-content: center;
            margin-right: 12px;
            color: #94a3b8;
            font-size: 1.3rem;
            cursor: grab;
            padding: 4px;
        }

        .item-text {
            font-size: 0.9rem;
            line-height: 1.4;
            flex-grow: 1;
            padding-right: 4px;
        }

        .footer-controls {
            display: flex;
            flex-direction: column;
            gap: 12px;
            align-items: center;
            width: 100%;
        }

        @media (min-width: 480px) {
            .footer-controls {
                flex-direction: row;
                justify-content: space-between;
            }
        }

        button {
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 14px 28px;
            font-size: 1rem;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            transition: background-color 0.2s;
        }

        @media (min-width: 480px) {
            button {
                width: auto;
            }
        }

        button:active {
            background-color: #1d4ed8;
        }

        button:disabled {
            background-color: #cbd5e1;
            cursor: not-allowed;
        }

        .score-display {
            font-size: 1.1rem;
            font-weight: 700;
        }

        .sortable-item.correct {
            border-color: var(--success-color) !important;
            background-color: #f0fdf4 !important;
        }
        
        .sortable-item.incorrect {
            border-color: var(--error-color) !important;
            background-color: #fef2f2 !important;
        }

        .result-section {
            margin-top: 20px;
            padding-top: 16px;
            border-top: 2px dashed var(--border-color);
            display: none;
        }

        .result-section h3 {
            margin-bottom: 8px;
            font-size: 1rem;
        }

        .story-paragraph {
            line-height: 1.6;
            font-size: 0.9rem;
            color: #334155;
            background: #f1f5f9;
            padding: 14px;
            border-radius: 8px;
            text-align: justify;
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>Rajshahi Board – 2023</h1>
        <div class="timer-badge" id="timer">10:00</div>
    </header>
    
    <p class="instructions">Tap & drag the handle (≡) to arrange the sentences. Press submit when complete.</p>
    
    <ul class="sortable-list" id="sortable-list"></ul>
    
    <div class="footer-controls">
        <button id="submit-btn">Submit Answer</button>
        <div class="score-display" id="score-display"></div>
    </div>

    <div class="result-section" id="result-section">
        <h3>Correct Story Sequence:</h3>
        <p class="story-paragraph" id="story-paragraph"></p>
    </div>
</div>

<script>
    const correctOrder = [
        "Once upon a time, there lived a fox in a forest.",
        "One day, he was very hungry.",
        "He searched food everywhere but he did not get any food.",
        "At last, he entered a vineyard.",
        "There were ripe grapes hanging up on the vine.",
        "The grapes were too high for him to reach.",
        "He took a run and jumped to reach the bunch of grapes but could not.",
        "Again and again he jumped.",
        "But each time, he failed to reach the grapes.",
        "At last being tired, he went away saying that the grapes were sour."
    ];

    let itemsData = [...correctOrder].map(text => ({ text }));
    do {
        itemsData.sort(() => Math.random() - 0.5);
    } while (itemsData.map(d => d.text).join('') === correctOrder.join(''));

    const listContainer = document.getElementById('sortable-list');
    const submitBtn = document.getElementById('submit-btn');
    const scoreDisplay = document.getElementById('score-display');
    const timerDisplay = document.getElementById('timer');
    const resultSection = document.getElementById('result-section');
    const storyParagraph = document.getElementById('story-paragraph');

    let isSubmitted = false;
    let timeRemaining = 600; 
    let timerInterval;

    itemsData.forEach((item) => {
        const li = document.createElement('li');
        li.className = 'sortable-item';
        li.dataset.text = item.text;
        li.innerHTML = `
            <div class="drag-handle">≡</div>
            <div class="item-text">${item.text}</div>
        `;
        listContainer.appendChild(li);
    });

    // Touch & Pointer Drag Mechanism for flawless mobile operation
    let activeItem = null;
    let initialY = 0;
    let currentY = 0;

    listContainer.addEventListener('pointerdown', (e) => {
        if (isSubmitted) return;
        const handle = e.target.closest('.drag-handle');
        if (!handle) return;
        
        activeItem = handle.closest('.sortable-item');
        activeItem.classList.add('dragging');
        initialY = e.clientY;
        activeItem.setPointerCapture(e.pointerId);
    });

    listContainer.addEventListener('pointermove', (e) => {
        if (!activeItem || isSubmitted) return;
        currentY = e.clientY;
        
        const targetElement = document.elementFromPoint(e.clientX, currentY);
        const nextItem = targetElement ? targetElement.closest('.sortable-item') : null;
        
        if (nextItem && nextItem !== activeItem) {
            const rect = nextItem.getBoundingClientRect();
            const nextItemCenter = rect.top + rect.height / 2;
            if (currentY < nextItemCenter) {
                listContainer.insertBefore(activeItem, nextItem);
            } else {
                listContainer.insertBefore(activeItem, nextItem.nextSibling);
            }
        }
    });

    const endDrag = (e) => {
        if (!activeItem) return;
        activeItem.classList.remove('dragging');
        activeItem.releasePointerCapture(e.pointerId);
        activeItem = null;
    };

    listContainer.addEventListener('pointerup', endDrag);
    listContainer.addEventListener('pointercancel', endDrag);

    // Timer Loop
    timerInterval = setInterval(() => {
        timeRemaining--;
        let mins = Math.floor(timeRemaining / 60);
        let secs = timeRemaining % 60;
        timerDisplay.textContent = `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
        
        if (timeRemaining <= 0) {
            clearInterval(timerInterval);
            handleSubmit();
        }
    }, 1000);

    function handleSubmit() {
        if (isSubmitted) return;
        isSubmitted = true;
        clearInterval(timerInterval);
        submitBtn.disabled = true;

        const currentItems = [...listContainer.querySelectorAll('.sortable-item')];
        let score = 0;

        currentItems.forEach((item, index) => {
            const text = item.dataset.text;
            if (correctOrder[index] === text) {
                score++;
