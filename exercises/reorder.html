<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rajshahi Board – 2023</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background-color: #fafafa; margin: 0; padding: 20px; color: #333; display: flex; justify-content: center; }
        .quiz-card { background: white; border: 1px solid #eaeaea; border-radius: 12px; padding: 24px; max-width: 600px; width: 100%; box-shadow: 0 4px 6px rgba(0,0,0,0.02); }
        .header-row { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #eaeaea; padding-bottom: 12px; margin-bottom: 16px; }
        h2 { font-size: 20px; font-weight: 700; color: #0f172a; margin: 0; }
        .timer { background: #fee2e2; color: #991b1b; font-weight: bold; font-size: 14px; padding: 4px 12px; border-radius: 20px; }
        .instruction { font-size: 14px; color: #64748b; margin-bottom: 20px; }
        
        .sortable-list { list-style: none; padding: 0; margin: 0 0 24px 0; }
        .sortable-item { background: #fff; border: 1px solid #cbd5e1; border-radius: 6px; padding: 12px 16px; margin-bottom: 8px; display: flex; align-items: center; cursor: grab; user-select: none; touch-action: none; }
        .sortable-item.dragging { opacity: 0.5; background: #eff6ff; border-color: #3b82f6; }
        .handle { color: #94a3b8; font-weight: bold; margin-right: 12px; font-size: 18px; cursor: move; }
        .text { font-size: 15px; color: #334155; }
        
        button { background: #2563eb; color: white; border: none; padding: 12px 24px; font-size: 16px; font-weight: 600; border-radius: 6px; cursor: pointer; width: 100%; transition: background 0.2s; }
        button:hover { background: #1d4ed8; }
        #result { margin-top: 16px; padding: 12px; border-radius: 6px; display: none; font-weight: bold; text-align: center; }
        .success { background: #dcfce7; color: #166534; border: 1px solid #bbf7d0; }
    </style>
</head>
<body>

<div class="quiz-card">
    <div class="header-row">
        <h2>Rajshahi Board – 2023</h2>
        <div class="timer">10:00</div>
    </div>
    <div class="instruction">Tap/Click & drag the handle (≡) to arrange the sentences. Press submit when complete.</div>
    
    <ul class="sortable-list" id="sentenceList"></ul>

    <button onclick="checkAnswer()">Submit Answer</button>
    <div id="result"></div>
</div>

<script>
    // আসল সঠিক ক্রম অনুসারে বাক্যগুলোর তালিকা
    const originalSentences = [
        "Once upon a time a fox lived in a dense forest.",
        "One day he felt very hungry and walked around looking for food.",
        "He searched for food everywhere but did not get any.",
        "At last, he entered into a vineyard.",
        "There were ripe grapes hanging up on the vine.",
        "The grapes were too high for the fox to reach.",
        "He took a run and jumped to reach the bunch of grapes.",
        "But he could not reach the bunch.",
        "Again and again he jumped but failed each time.",
        "At last, he went away saying that the grapes were sour."
    ];

    const listContainer = document.getElementById('sentenceList');
    
    // মিক্সড বা এলোমেলো করার লজিক
    let shuffledSentences = [...originalSentences].sort(() => Math.random() - 0.5);

    // স্ক্রিনে বাক্যগুলো তৈরি করা
    shuffledSentences.forEach(text => {
        const li = document.createElement('li');
        li.className = 'sortable-item';
        li.draggable = true;
        li.innerHTML = `<span class="handle">≡</span><span class="text">${text}</span>`;
        
        // মাউস দিয়ে ড্র্যাগ করার ইভেন্ট
        li.addEventListener('dragstart', () => li.classList.add('dragging'));
        li.addEventListener('dragend', () => li.classList.remove('dragging'));
        
        // মোবাইল/টাচ স্ক্রিনের জন্য ড্র্যাগ ইভেন্ট
        li.addEventListener('touchstart', (e) => {
            li.classList.add('dragging');
        }, {passive: true});
        li.addEventListener('touchend', () => li.classList.remove('dragging'));
        
        listContainer.appendChild(li);
    });

    // ড্র্যাগ করে পজিশন বদলানোর লজিক
    listContainer.addEventListener('dragover', e => {
        e.preventDefault();
        const dragging = document.querySelector('.dragging');
        const afterElement = getDragAfterElement(listContainer, e.clientY);
        if (afterElement == null) {
            listContainer.appendChild(dragging);
        } else {
            listContainer.insertBefore(dragging, afterElement);
        }
    });

    // মোবাইল টাচ মুভমেন্ট হ্যান্ডেল করার লজিক
    listContainer.addEventListener('touchmove', e => {
        e.preventDefault();
        const touch = e.touches[0];
        const dragging = document.querySelector('.dragging');
        if (!dragging) return;
        const afterElement = getDragAfterElement(listContainer, touch.clientY);
        if (afterElement == null) {
            listContainer.appendChild(dragging);
        } else {
            listContainer.insertBefore(dragging, afterElement);
        }
    }, {passive: false});

    function getDragAfterElement(container, y) {
        const draggableElements = [...container.querySelectorAll('.sortable-item:not(.dragging)')];
        return draggableElements.reduce((closest, child) => {
            const box = child.getBoundingClientRect();
            const offset = y - box.top - box.height / 2;
            if (offset < 0 && offset > closest.offset) {
                return { offset: offset, element: child };
            } else {
                return closest;
            }
        }, { offset: Number.NEGATIVE_INFINITY }).element;
    }

    // চূড়ান্ত উত্তর এবং স্কোর মেলানোর ফাংশন (১০০% নির্ভুল)
    function checkAnswer() {
        const currentItems = [...listContainer.querySelectorAll('.text')];
        let correctCount = 0;
        
        currentItems.forEach((item, index) => {
            // শিক্ষার্থীর সাজানো বাক্যের টেক্সটের সাথে আসল সঠিক বাক্যের টেক্সট মেলানো হচ্ছে
            if(item.innerText.trim() === originalSentences[index].trim()) {
                correctCount++;
            }
        });

        const resultDiv = document.getElementById('result');
        resultDiv.style.display = "block";
        resultDiv.className = "success";
        resultDiv.innerText = `Result: ${correctCount} / 10 sentences are correct!`;
    }
</script>

</body>
</html>
