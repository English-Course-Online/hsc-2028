<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rajshahi Board – 2023</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background-color: #fafafa; margin: 0; padding: 20px; color: #333; display: flex; justify-content: center; }
        .quiz-card { background: white; border: 1px solid #eaeaea; border-radius: 12px; padding: 24px; max-width: 600px; width: 100%; box-shadow: 0 4px 6px rgba(0,0,0,0.02); }
        .header-row { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #eaeaea; padding-bottom: 12px; margin-bottom: 16px; }
        h2 { font-size: 20px; font-weight: 700; color: #0f172a; margin: 0; }
        .timer { background: #fee2e2; color: #991b1b; font-weight: bold; font-size: 14px; padding: 4px 12px; border-radius: 20px; }
        .instruction { font-size: 14px; color: #64748b; margin-bottom: 20px; }
        
        /* Drag and Drop List Styling */
        .sortable-list { list-style: none; padding: 0; margin: 0 0 24px 0; }
        .sortable-item { background: #fff; border: 1px solid #cbd5e1; border-radius: 6px; padding: 12px 16px; margin-bottom: 8px; display: flex; align-items: center; cursor: grab; user-select: none; }
        .sortable-item:active { cursor: grabbing; background: #f8fafc; }
        .handle { color: #94a3b8; font-weight: bold; margin-right: 12px; font-size: 18px; }
        .text { font-size: 15px; color: #334155; }
        
        button { background: #2563eb; color: white; border: none; padding: 12px 24px; font-size: 16px; font-weight: 600; border-radius: 6px; cursor: pointer; width: 100%; transition: background 0.2s; }
        button:hover { background: #1d4ed8; }
        #result { margin-top: 16px; padding: 12px; border-radius: 6px; display: none; font-weight: bold; text-align: center; }
        .success { background: #dcfce7; color: #166534; }
    </style>
</head>
<body>

<div class="quiz-card">
    <div class="header-row">
        <h2>Rajshahi Board – 2023</h2>
        <div class="timer">10:00</div>
    </div>
    <div class="instruction">Tap & drag the handle (≡) to arrange the sentences. Press submit when complete.</div>
    
    <!-- এই লিস্টের ভেতরেই বাক্যগুলো দেখা যাবে -->
    <ul class="sortable-list" id="sentenceList">
        <!-- জাভাস্ক্রিপ্ট দিয়ে বাক্যগুলো নিচে স্বয়ংক্রিয়ভাবে লোড হবে -->
    </ul>

    <button onclick="checkAnswer()">Submit Answer</button>
    <div id="result"></div>
</div>

<script>
    // রাজশাহী বোর্ড ২০২৩ এর এলোমেলো করা বাক্যগুলো
    const sentences = [
        { id: 1, text: "Once upon a time a fox lived in a dense forest." },
        { id: 2, text: "One day he felt very hungry and walked around looking for food." },
        { id: 3, text: "He searched for food everywhere but did not get any." },
        { id: 4, text: "At last, he entered into a vineyard." },
        { id: 5, text: "There were ripe grapes hanging up on the vine." },
        { id: 6, text: "The grapes were too high for the fox to reach." },
        { id: 7, text: "He took a run and jumped to reach the bunch of grapes." },
        { id: 8, text: "But he could not reach the bunch." },
        { id: 9, text: "Again and again he jumped but failed each time." },
        { id: 10, text: "At last, he went away saying that the grapes were sour." }
    ];

    // বাক্যগুলোকে স্ক্রিনে দেখানোর ফাংশন
    const listContainer = document.getElementById('sentenceList');
    
    // শিক্ষার্থীদের জন্য পরীক্ষার শুরুতে বাক্যগুলো এলোমেলো (Shuffle) করে দেখানোর নিয়ম
    const shuffled = [...sentences].sort(() => Math.random() - 0.5);

    shuffled.forEach(item => {
        const li = document.createElement('li');
        li.className = 'sortable-item';
        li.draggable = true;
        li.setAttribute('data-id', item.id);
        li.innerHTML = `<span class="handle">≡</span><span class="text">${item.text}</span>`;
        
        // Drag and drop event listeners
        li.addEventListener('dragstart', () => li.classList.add('dragging'));
        li.addEventListener('dragend', () => li.classList.remove('dragging'));
        
        listContainer.appendChild(li);
    });

    // ড্র্যাগ অ্যান্ড ড্রপ লজিক
    listContainer.addEventListener('dragover', e => {
        e.preventDefault();
        const afterElement = getDragAfterElement(listContainer, e.clientY);
        const dragging = document.querySelector('.dragging');
        if (afterElement == null) {
            listContainer.appendChild(dragging);
        } else {
            listContainer.insertBefore(dragging, afterElement);
        }
    });

    function getDragAfterElement(container, y) {
        const draggableElements = [...container.querySelectorAll('.sortable-item:not(.dragging)')];
        return draggableElements.reduce((closest, child) => {
            const box = child.getBoundingClientRect();
            const offset = y - box.top - box.height / 2;
            if (offset < 0 && offset > closest.offset) {
                return { offset: offset, element: child };
            } else {
                return closest;
            }
        }, { offset: Number.NEGATIVE_INFINITY }).element;
    }

    // উত্তর যাচাই করার ফাংশন
    function checkAnswer() {
        const currentOrder = [...listContainer.querySelectorAll('.sortable-item')].map(li => parseInt(li.getAttribute('data-id')));
        let correctCount = 0;
        
        currentOrder.forEach((id, index) => {
            if(id === index + 1) correctCount++;
        });

        const resultDiv = document.getElementById('result');
        resultDiv.style.display = "block";
        resultDiv.className = "success";
        resultDiv.innerText = `You correctly placed ${correctCount} out of 10 sentences!`;
    }
</script>

</body>
</html>
